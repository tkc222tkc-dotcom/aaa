<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Garden | 勉強に集中するためのサイト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Focus Garden</p>
        <h1 id="page-title">今日の勉強を、静かに始めよう。</h1>
        <p class="hero-copy">タイマー、タスク、呼吸リセット、環境音をひとつにまとめた集中サポートサイトです。</p>
      </div>
      <div class="focus-card" aria-live="polite">
        <span class="card-label">現在のモード</span>
        <strong id="modeLabel">集中</strong>
        <p id="sessionHint">25分集中して、5分休憩しましょう。</p>
      </div>
    </section>

    <section class="dashboard" aria-label="集中ダッシュボード">
      <article class="panel timer-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Pomodoro Timer</p>
            <h2>集中タイマー</h2>
          </div>
          <span class="streak"><span id="completedSessions">0</span> セッション完了</span>
        </div>

        <div class="timer" role="timer" aria-live="polite" id="timerDisplay">25:00</div>
        <div class="progress-ring" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="54"></circle>
            <circle class="progress" id="progressCircle" cx="60" cy="60" r="54"></circle>
          </svg>
        </div>

        <div class="timer-actions">
          <button class="primary" id="startPauseButton">スタート</button>
          <button id="resetButton">リセット</button>
          <button id="switchModeButton">休憩に切替</button>
        </div>

        <div class="settings-grid">
          <label>集中時間
            <input id="focusMinutes" type="number" min="5" max="90" value="25">
          </label>
          <label>休憩時間
            <input id="breakMinutes" type="number" min="1" max="30" value="5">
          </label>
        </div>
      </article>

      <article class="panel task-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Tiny Goals</p>
            <h2>今やること</h2>
          </div>
        </div>
        <form id="taskForm" class="task-form">
          <input id="taskInput" type="text" placeholder="例：英単語を20個覚える" aria-label="追加するタスク">
          <button class="primary" type="submit">追加</button>
        </form>
        <ul id="taskList" class="task-list" aria-label="タスク一覧"></ul>
      </article>

      <article class="panel tools-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Reset & Sound</p>
            <h2>集中を整える</h2>
          </div>
        </div>
        <div class="breathing-box">
          <span id="breathingCue">吸って</span>
          <div class="breathing-orb" aria-hidden="true"></div>
          <button id="breathingButton">呼吸リセット開始</button>
        </div>
        <div class="sound-mixer">
          <button class="sound active" data-sound="rain">雨音</button>
          <button class="sound" data-sound="forest">森</button>
          <button class="sound" data-sound="cafe">カフェ</button>
          <button id="soundToggle">環境音 OFF</button>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
